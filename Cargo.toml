[workspace]
resolver = "2"
members = [
    "smoke-core",
    "smoke-cli",
]

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
socket2 = { version = "0.5", features = ["all"] }
bytes = "1.7"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hickory-resolver = { version = "0.24", features = ["tokio-runtime", "dns-over-https-rustls", "webpki-roots"] }
clap = { version = "4.5", features = ["derive"] }
winreg = "0.55"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
